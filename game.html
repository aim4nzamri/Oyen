<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff8a1f" />
    <title>Game: Selamatkan Ikan Goreng — Oyen &amp; Abu</title>
    <meta name="description" content="Tolong Oyen curi ikan goreng dari dapur mak, tapi elak selipar terbang! Game kucing oren untuk phone dan desktop." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body data-page="game">
    <main class="game-page">
      <h1 class="game-title">Selamatkan Ikan Goreng 🐟</h1>
      <div class="hud" aria-live="polite">
        <span class="hud-item">Skor <b id="score">0</b></span>
        <span class="hud-item" id="lives" aria-label="3 nyawa">🧡🧡🧡</span>
        <span class="hud-item">Rekod <b id="best">0</b></span>
        <button class="hud-btn" id="pause" aria-label="Pause" disabled><span class="icon-pause" aria-hidden="true"></span></button>
      </div>
      <div class="game-wrap">
        <canvas id="game" tabindex="0" aria-label="Game Selamatkan Ikan Goreng. Guna anak panah kiri dan kanan untuk gerak."></canvas>
        <div class="overlay" id="overlay" hidden></div>
      </div>
    </main>
    <script type="module" src="./src/js/game.js"></script>
  </body>
</html>
